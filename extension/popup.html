<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0a0a0c;
      color: #e5e5e5;
    }
    .header {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
      color: #a3a3a3;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #262626;
    }
    .label { font-size: 12px; font-weight: 500; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #262626; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: #e5e5e5; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #ffffff; }
    input:checked + .slider:before { transform: translateX(14px); background-color: #0a0a0c; }
    
    .textarea-label { font-size: 10px; text-transform: uppercase; color: #737373; margin-bottom: 6px; display: block; }
    textarea {
      width: 100%; height: 80px; background-color: #171717; border: 1px solid #262626;
      border-radius: 6px; color: #e5e5e5; font-family: monospace; font-size: 11px; padding: 6px;
      box-sizing: border-box; resize: none;
    }
    textarea:focus { outline: none; border-color: #737373; }
    .status { font-size: 10px; color: #a3a3a3; margin-top: 8px; text-align: right; font-style: italic; opacity: 0.4; transition: opacity 0.2s; }
  </style>
</head>
<body>
  <div class="header">RabbitHole Ingest</div>
  
  <div class="toggle-container">
    <span class="label">Limit to Focus Domains</span>
    <label class="switch">
      <input type="checkbox" id="filterToggle">
      <span class="slider"></span>
    </label>
  </div>

  <span class="textarea-label">Allowed Domains</span>
  <textarea id="domainList" placeholder="github.com, stackoverflow.com"></textarea>
  <div class="status" id="statusMsg">Settings saved</div>

  <script src="/popup.js"></script>
</body>
</html>
